schema_version: "1.1"
name: deck-speaker-density
expected_outcome: |
  The ghost deck declares speaker-led density with a text budget of about 40
  body words per content slide and gives every title a form mark; at least
  two thirds of the content titles carry chart, table or concept marks, and
  the two "text" marks give a reason. After the one-shot instruction the deck
  is built exhibits first: the lifecycle as a cycle (four nodes), the two
  positions as a contrast or continuum, the dated events as a timeline, the
  three hurdles as a three-row table (hurdle, today, contractual fix) or three labelled cards, not sentences. No
  content slide carries more than about 40 body words; the explanatory text
  sits in the speaker notes. The delivery note reports words per slide and
  the exhibit ratio, and says whether the render check ran.
